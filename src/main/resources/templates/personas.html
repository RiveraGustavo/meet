<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Personas</title>
</head>
<body>
	<header>
		<h1>Personas</h1>
		<nav>
			<a href="/index">Inicio</a>
			<a href="/personas">Personas</a>
			<form th:action="@{/logout}" method="post" style="display: inline;">
				<button type="submit">Cerrar sesión</button>
			</form>
		</nav>
	</header>

	<main>
		<h2>Listado de personas</h2>
		<!--p><a href="/personas/nueva">Agregar persona</a></p-->

		<table>
			<thead>
				<tr>
					<th>Nombre</th>
					<th>Correo electrónico</th>
					<th>Teléfono</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="persona:${personas}">
					<td th:text="${persona.name}">Nombre</td>
					<td th:text="${persona.email}">Correo electrónico</td>
					<td th:text="${persona.phone}">Teléfono</td>
					<td>
						<a href="/personas/1">Ver</a>
						<a href="/personas/1/editar">Editar</a>
						<form action="/personas/1/eliminar" method="post">
							<button type="submit">Eliminar</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</main>

	<footer>
		<p>&copy; Personas</p>
	</footer>
</body>
</html>
